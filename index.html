<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7254c8">
  <title>RITMO — Tu vida, en movimiento</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <h1>RITMO</h1>
          <p>Tu vida, en movimiento.</p>
        </div>
      </div>
      <div class="header-date" id="today"></div>
    </header>

    <main>
      <section id="home-screen" class="home-screen">
        <div class="welcome">
          <h2>¡Bienvenida a RITMO!</h2>
          <p>Organiza tu vida, alcanza tus metas y avanza a tu ritmo.</p>
        </div>

        <div class="home-grid">
          <button class="home-card organization-card" data-section="organizacion">
            <span class="home-icon">✓</span>
            <span class="home-card-title">Mi organización</span>
            <span class="home-card-description">Organiza tus tareas y tu día</span>
            <span class="home-arrow">→</span>
          </button>

          <button class="home-card challenges-card" data-section="retos">
            <span class="home-icon">◎</span>
            <span class="home-card-title">Mis retos</span>
            <span class="home-card-description">Ponte objetivos y supérate</span>
            <span class="home-arrow">→</span>
          </button>

          <button class="home-card progress-card" data-section="progreso">
            <span class="home-icon">↗</span>
            <span class="home-card-title">Mi progreso</span>
            <span class="home-card-description">Descubre cuánto has avanzado</span>
            <span class="home-arrow">→</span>
          </button>

          <button class="home-card shared-card" data-section="compartidos">
            <span class="home-icon">♡</span>
            <span class="home-card-title">Retos compartidos</span>
            <span class="home-card-description">Comparte tus retos con alguien</span>
            <span class="home-arrow">→</span>
          </button>
        </div>
      </section>

      <section id="section-screen" hidden>
        <button type="button" id="back-home" class="back-home">← Volver al inicio</button>

        <section class="page-heading">
          <h2 id="page-title"></h2>
          <p id="page-description"></p>
        </section>

        <div id="section-content"></div>
      </section>
    </main>

    <footer class="app-footer">
      RITMO · Tu vida, en movimiento.
    </footer>
  </div>
</body>
        </html>
