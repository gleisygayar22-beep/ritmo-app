
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7256d8">
  <title>RITMO | Tu vida, en movimiento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">R</span>
        <div>
          <h1>RITMO</h1>
          <p>Tu vida, en movimiento</p>
        </div>
      </div>
      <span id="today"></span>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <p class="menu-label">MENÚ PRINCIPAL</p>
        <button class="nav-button active" data-section="organization">Mi organización</button>
        <button class="nav-button" data-section="progress">Mi progreso</button>
        <button class="nav-button" data-section="challenges">Mis retos</button>
        <button class="nav-button" data-section="shared">Retos compartidos</button>
      </aside>

      <main class="content">
        <section id="organization" class="section active">
          <h2>Mi organización</h2>
          <p class="subtitle">Organiza tus tareas y avanza a tu ritmo.</p>

          <form id="task-form" class="task-form">
            <input id="task-input" type="text" placeholder="¿Qué tienes pendiente?" required>

            <div class="task-options">
              <label>Fecha límite
                <input id="task-date" type="date">
              </label>

              <label>Prioridad
                <select id="task-priority">
                  <option value="Media">Media</option>
                  <option value="Alta">Alta</option>
                  <option value="Baja">Baja</option>
                </select>
              </label>

              <label>Categoría
                <select id="task-category"></select>
              </label>
            </div>

            <div class="category-creator">
              <input id="new-category" type="text" placeholder="Nombre de una nueva categoría">
              <button type="button" id="add-category">+ Crear categoría</button>
            </div>

            <div id="category-list"></div>
            <button type="submit">+ Añadir tarea</button>
          </form>

          <div class="task-summary">
            <span id="pending-count">0 tareas pendientes</span>
          </div>
          <div id="task-list"></div>
        </section>

        <section id="progress" class="section">
          <h2>Mi progreso</h2>
          <p class="subtitle">Mira todo lo que vas consiguiendo.</p>
          <div id="progress-content"></div>
        </section>

        <section id="challenges" class="section">
          <h2>Mis retos</h2>
          <p class="subtitle">Pequeños objetivos, grandes avances.</p>
          <form id="challenge-form">
            <input id="challenge-input" type="text" placeholder="Escribe un nuevo reto..." required>
            <button type="submit">+ Crear reto</button>
          </form>
          <div id="challenge-list"></div>
        </section>

        <section id="shared" class="section">
          <h2>Retos compartidos</h2>
          <p class="subtitle">Propón retos para compartir con otras personas.</p>
          <form id="shared-form">
            <input id="shared-input" type="text" placeholder="¿Qué reto quieres proponer?" required>
            <button type="submit">+ Proponer reto</button>
          </form>
          <div id="shared-list"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
  </html>
